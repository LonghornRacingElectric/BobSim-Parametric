schema: bobsim.parametric_target_study.v1
document_role: descriptive_study_contract_not_runtime_configuration
runtime_definition: _3_StandardSim/ParametricEval/targets_2027.py
source_vehicle: _3_StandardSim/ParametricEval/configs/2027_source.yml
vehicle_basis: frame_torsion_study_workbook
primary_objective: turn_in_at_matched_reference_LLTD
target_status: provisional_mechanical_screen_not_hardware_release
aero: withheld_inconsistent_source_moment_balance
flat_road_only: true
reference_speed_mps: 15
reference_ay_mps2: 8
rc_grid_mm: [10, 20, 30, 40, 50, 60]
arb_policy: fixed_source_total_nonnegative_each_axle
arb_hardware_adjustability_verified: false
anti_reference: total_vehicle_nominal_flat_road
anti_grid: [0, 0.25, 0.5, 0.75, 1.0]
longitudinal_path: translating_upright_same_reciprocal_path_brake_and_drive
force_path_hardware_validated: false
nominal_brake_front_fraction: 0.84
brake_pulse_ax_demand_mps2: -8
traction_pulse_ax_demand_mps2: 5
combined_trail_ax_demand_mps2: -5
combined_exit_ax_demand_mps2: 3
steering_ramp_roadwheel_deg: 2
steering_ramp_s: 0.15
gates:
  tire_load_domain_n: [100, 1800]
  provisional_travel_mm: [-30, 30]
  steering_speed_error_mps: 0.2
  steady_response_gain_difference_fraction: 0.01
  turnin_overshoot_pct: 5
  turnin_settling_s: 1
  comparison_time_band_fraction: 0.01
gates_are_engineering_screening_choices_not_measured_requirements: true
validation_speeds_mps: [10, 15, 20]
required_before_release:
  - corrected_current_aero_map_and_physical_datums
  - verified_travel_ground_clearance_and_installed_ARB_range
  - brake_halfshaft_and_rotor_reaction_path_validation
  - tire_relaxation_unsprung_and_rough_road_validation
  - actual_alignment_migration_and_chassis_torsion_sensitivity
  - vehicle_test_correlation
