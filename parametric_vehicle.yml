# Illustrative research vehicle. Not a correlated LHRe/2027 configuration.
schema: bobsim.parametric.v1
description: Hardpoint-free suspension sensitivity example; aero disabled
tire_file: _0_Utils/tire_templates/16x7p5_10_12psi.tir
vehicle:
  mass_kg: 280.0
  wheelbase_m: 1.55
  cg_from_front_axle_m: 0.85
  cg_height_m: 0.30
  inertia_kg_m2: [[25, 0, 0], [0, 60, 0], [0, 0, 65]]
  sprung_inertia_kg_m2: [[20, 0, 0], [0, 45, 0], [0, 0, 50]]
front:
  track_m: 1.21
  roll_center_height_m: 0.02
  static_camber_deg: -1.5
  camber_gain_deg_per_m: -20.0 # -0.5 degree per 25 mm bump
  toe_in_deg: 0.0
  toe_in_gain_deg_per_m: 0.0
  motion_ratio_spring_per_wheel: 0.8
  spring_rate_n_per_m: 40000.0
  damper_n_s_per_m: 1800.0
  arb_roll_stiffness_nm_per_rad: 1500.0
rear:
  track_m: 1.20
  roll_center_height_m: 0.03
  static_camber_deg: -1.0
  camber_gain_deg_per_m: -15.0
  toe_in_deg: 0.0
  motion_ratio_spring_per_wheel: 0.8
  spring_rate_n_per_m: 45000.0
  damper_n_s_per_m: 1800.0
  arb_roll_stiffness_nm_per_rad: 1200.0
aero:
  cl_area_m2: 0.0
  cd_area_m2: 0.0
  balance_front: 0.5
powertrain:
  peak_power_w: 80000.0
  peak_force_n: 3700.0
  maximum_speed_mps: 40.0
  drive_front_fraction: 0.0
  brake_front_fraction: 0.6
